<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Growth Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <canvas id="crystalCanvas"></canvas>

        <div class="controls">
            <div class="control-panel">
                <h1>Crystal Growth Simulator</h1>
                <p class="instruction">Click anywhere to spawn crystalline formations</p>

                <div class="control-group">
                    <label for="growthSpeed">Growth Speed</label>
                    <input type="range" id="growthSpeed" min="0.5" max="5" step="0.1" value="2">
                    <span class="value" id="speedValue">2.0</span>
                </div>

                <div class="control-group">
                    <label for="complexity">Complexity</label>
                    <input type="range" id="complexity" min="3" max="12" step="1" value="6">
                    <span class="value" id="complexityValue">6</span>
                </div>

                <div class="control-group">
                    <label for="branchLength">Branch Length</label>
                    <input type="range" id="branchLength" min="10" max="100" step="5" value="40">
                    <span class="value" id="branchValue">40</span>
                </div>

                <div class="control-group">
                    <label for="particleDensity">Particle Density</label>
                    <input type="range" id="particleDensity" min="0.1" max="2" step="0.1" value="1">
                    <span class="value" id="densityValue">1.0</span>
                </div>

                <div class="control-group">
                    <label>Color Palette</label>
                    <div class="palette-buttons">
                        <button class="palette-btn active" data-palette="ice">Ice Blues</button>
                        <button class="palette-btn" data-palette="acid">Acid Greens</button>
                        <button class="palette-btn" data-palette="blood">Blood Reds</button>
                        <button class="palette-btn" data-palette="aurora">Aurora</button>
                        <button class="palette-btn" data-palette="toxic">Toxic</button>
                    </div>
                </div>

                <div class="control-group">
                    <button id="clearBtn" class="action-btn">Clear Canvas</button>
                    <button id="pauseBtn" class="action-btn">Pause</button>
                </div>

                <div class="stats">
                    <div class="stat">Crystals: <span id="crystalCount">0</span></div>
                    <div class="stat">Particles: <span id="particleCount">0</span></div>
                </div>
            </div>
        </div>
    </div>

    <script src="crystal.js"></script>
</body>
</html>
