<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fidenza-like Generative Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace;
    color: #aaa;
  }
  canvas {
    display: block;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
  }
  #controls {
    margin-top: 16px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  button {
    background: #222;
    color: #ccc;
    border: 1px solid #444;
    padding: 6px 16px;
    cursor: pointer;
    font-family: monospace;
    font-size: 13px;
    letter-spacing: 1px;
  }
  button:hover { background: #333; border-color: #666; }
  #seed-display { font-size: 12px; color: #555; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls">
  <button onclick="generate()">NEW</button>
  <button onclick="saveImage()">SAVE</button>
  <span id="seed-display">seed: —</span>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const SIZE = Math.min(window.innerWidth, window.innerHeight, 800);
canvas.width = SIZE;
canvas.height = SIZE;

// Seeded PRNG (mulberry32)
let seed;
function setSeed(s) { seed = s >>> 0; }
function rand() {
  seed ^= seed << 13; seed ^= seed >> 17; seed ^= seed << 5;
  return ((seed >>> 0) / 4294967296);
}
function randRange(a, b) { return a + rand() * (b - a); }
function randInt(a, b) { return Math.floor(randRange(a, b + 1)); }
function randChoice(arr) { return arr[Math.floor(rand() * arr.length)]; }

// Palettes inspired by Tyler Hobbs' work
const PALETTES = [
  { bg: '#f5f0e8', colors: ['#c0392b','#e67e22','#f1c40f','#27ae60','#2980b9','#8e44ad','#2c3e50'] },
  { bg: '#1a1a2e', colors: ['#e94560','#0f3460','#533483','#e94560','#f5a623','#7ed6df','#ff7979'] },
  { bg: '#fdf6e3', colors: ['#657b83','#268bd2','#2aa198','#859900','#b58900','#cb4b16','#dc322f'] },
  { bg: '#0d0d0d', colors: ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#00d2d3'] },
  { bg: '#fffdf5', colors: ['#2d4739','#5c7a5e','#a8c5a2','#d4a373','#8b5e3c','#c9785a','#e8c4a0'] },
  { bg: '#f0ebe1', colors: ['#264653','#2a9d8f','#e9c46a','#f4a261','#e76f51','#023047','#8ecae6'] },
  { bg: '#fafafa', colors: ['#3d405b','#81b29a','#f2cc8f','#e07a5f','#f4f1de','#264653','#2a9d8f'] },
  { bg: '#16213e', colors: ['#a8dadc','#457b9d','#1d3557','#e63946','#f1faee','#06d6a0','#ffd166'] },
];

// Simplex-like noise (2D gradient noise)
class Noise {
  constructor(s) {
    this.perm = new Uint8Array(512);
    for (let i = 0; i < 256; i++) this.perm[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [this.perm[i], this.perm[j]] = [this.perm[j], this.perm[i]];
    }
    for (let i = 0; i < 256; i++) this.perm[i + 256] = this.perm[i];
  }
  fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  lerp(a, b, t) { return a + t * (b - a); }
  grad(h, x, y) {
    h &= 3;
    const u = h < 2 ? x : y, v = h < 2 ? y : x;
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  get(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = this.fade(x), v = this.fade(y);
    const a = this.perm[X] + Y, b = this.perm[X + 1] + Y;
    return this.lerp(
      this.lerp(this.grad(this.perm[a], x, y), this.grad(this.perm[b], x - 1, y), u),
      this.lerp(this.grad(this.perm[a + 1], x, y - 1), this.grad(this.perm[b + 1], x - 1, y - 1), u),
      v
    );
  }
}

// Curve system
class Curve {
  constructor(x, y, color, width, noise, params) {
    this.pts = [{x, y}];
    this.color = color;
    this.width = width;
    this.noise = noise;
    this.params = params;
    this.alive = true;
    this.len = 0;
    this.maxLen = randRange(params.minLen, params.maxLen);
    this.speed = randRange(1.5, 3.5);
    this.angle = rand() * Math.PI * 2;
  }

  step(grid) {
    if (!this.alive) return;
    const last = this.pts[this.pts.length - 1];
    const nx = last.x / SIZE;
    const ny = last.y / SIZE;

    // Flow field angle from multiple octaves of noise
    const scale = this.params.noiseScale;
    const angle =
      this.noise.get(nx * scale, ny * scale) * Math.PI * 2 +
      this.noise.get(nx * scale * 2 + 100, ny * scale * 2 + 100) * Math.PI * 0.5;

    // Blend with current angle for smoothness
    this.angle = this.angle * 0.85 + angle * 0.15;

    const dx = Math.cos(this.angle) * this.speed;
    const dy = Math.sin(this.angle) * this.speed;
    const nx2 = last.x + dx;
    const ny2 = last.y + dy;

    // Boundary check
    const margin = -this.width;
    if (nx2 < margin || nx2 > SIZE - margin || ny2 < margin || ny2 > SIZE - margin) {
      this.alive = false;
      return;
    }

    // Collision grid check
    const gx = Math.floor(nx2 / grid.cell);
    const gy = Math.floor(ny2 / grid.cell);
    if (grid.check(gx, gy, this.width * 0.7)) {
      this.alive = false;
      return;
    }
    grid.mark(gx, gy);

    this.pts.push({x: nx2, y: ny2});
    this.len++;
    if (this.len >= this.maxLen) this.alive = false;
  }

  draw(ctx) {
    if (this.pts.length < 3) return;
    ctx.beginPath();
    ctx.moveTo(this.pts[0].x, this.pts[0].y);
    for (let i = 1; i < this.pts.length - 1; i++) {
      const mx = (this.pts[i].x + this.pts[i + 1].x) / 2;
      const my = (this.pts[i].y + this.pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(this.pts[i].x, this.pts[i].y, mx, my);
    }
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = randRange(0.7, 1.0);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// Sparse collision grid
class Grid {
  constructor(cell) {
    this.cell = cell;
    this.cells = new Map();
  }
  key(x, y) { return (x << 16) | y; }
  mark(x, y) { this.cells.set(this.key(x, y), true); }
  check(x, y, r) {
    const cr = Math.ceil(r / this.cell);
    for (let dx = -cr; dx <= cr; dx++)
      for (let dy = -cr; dy <= cr; dy++)
        if (this.cells.has(this.key(x + dx, y + dy))) return true;
    return false;
  }
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function generate() {
  const s = Math.floor(Math.random() * 0xFFFFFFFF);
  setSeed(s);
  document.getElementById('seed-display').textContent = `seed: ${s}`;
  draw();
}

function draw() {
  const palette = randChoice(PALETTES);
  const noise = new Noise(seed);

  // Background
  ctx.fillStyle = palette.bg;
  ctx.fillRect(0, 0, SIZE, SIZE);

  // Occasionally add a subtle textured background
  if (rand() > 0.5) {
    for (let i = 0; i < 8000; i++) {
      ctx.fillStyle = hexToRgba(randChoice(palette.colors), 0.015);
      ctx.fillRect(rand() * SIZE, rand() * SIZE, rand() * 3 + 1, rand() * 3 + 1);
    }
  }

  // Parameters
  const noiseScale = randRange(1.5, 5);
  const minLen = randRange(40, 120);
  const maxLen = minLen + randRange(60, 300);
  const minWidth = randRange(1, 4);
  const maxWidth = minWidth + randRange(4, 24);
  const curveCount = randInt(80, 320);
  const cellSize = randRange(3, 8);

  const params = { noiseScale, minLen, maxLen };
  const grid = new Grid(cellSize);

  // Color assignment strategy
  const strategyRoll = rand();
  function pickColor(x, y) {
    if (strategyRoll < 0.33) {
      return randChoice(palette.colors);
    } else if (strategyRoll < 0.66) {
      // Spatial color zones
      const zone = Math.floor((x / SIZE) * palette.colors.length);
      return palette.colors[Math.min(zone, palette.colors.length - 1)];
    } else {
      // Noise-based color
      const v = (noise.get(x / SIZE * 3, y / SIZE * 3) + 1) / 2;
      return palette.colors[Math.floor(v * palette.colors.length) % palette.colors.length];
    }
  }

  // Occasionally draw large background rectangles (Fidenza hallmark)
  if (rand() > 0.4) {
    const rectCount = randInt(2, 8);
    for (let i = 0; i < rectCount; i++) {
      const rx = rand() * SIZE * 0.7;
      const ry = rand() * SIZE * 0.7;
      const rw = randRange(SIZE * 0.1, SIZE * 0.5);
      const rh = randRange(SIZE * 0.1, SIZE * 0.4);
      ctx.fillStyle = hexToRgba(randChoice(palette.colors), randRange(0.04, 0.12));
      ctx.fillRect(rx, ry, rw, rh);
    }
  }

  // Generate and draw curves iteratively
  let attempts = 0;
  let drawn = 0;
  const maxAttempts = curveCount * 6;

  function step() {
    for (let batch = 0; batch < 3 && drawn < curveCount && attempts < maxAttempts; batch++) {
      attempts++;
      const x = randRange(SIZE * 0.02, SIZE * 0.98);
      const y = randRange(SIZE * 0.02, SIZE * 0.98);
      const gx = Math.floor(x / grid.cell);
      const gy = Math.floor(y / grid.cell);

      const w = randRange(minWidth, maxWidth);
      if (grid.check(gx, gy, w * 0.5)) continue;

      const color = pickColor(x, y);
      const curve = new Curve(x, y, color, w, noise, params);

      while (curve.alive) curve.step(grid);
      if (curve.pts.length >= 3) {
        curve.draw(ctx);
        drawn++;
      }
    }

    if (drawn < curveCount && attempts < maxAttempts) {
      requestAnimationFrame(step);
    } else {
      // Final vignette
      const vg = ctx.createRadialGradient(SIZE/2, SIZE/2, SIZE*0.3, SIZE/2, SIZE/2, SIZE*0.8);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.25)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, SIZE, SIZE);
    }
  }
  requestAnimationFrame(step);
}

function saveImage() {
  const a = document.createElement('a');
  a.download = `fidenza-${Date.now()}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

generate();
</script>
</body>
</html>
